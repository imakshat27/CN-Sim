name: Verify routing workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend logic and syntax
        run: |
          node --test tests/frontend.test.mjs
          node --check dist/app.js
          node --check dist/views.js
      - name: Build and start isolated routing service
        run: docker compose up -d --build --wait
      - name: Backend validation and measurement tests
        run: docker compose exec -T lab python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Production gateway and origin guards
        run: python3 tests/deployment_smoke.py
      - name: Real routing integration
        run: python3 tests/integration.py
      - name: API lifecycle and export checks
        run: python3 tests/api_edges.py
      - name: Server logs
        if: always()
        run: docker compose logs --no-color
      - name: Collect synthetic experiment observations
        if: always()
        run: |
          mkdir -p artifacts/ci
          docker compose cp lab:/data/runs artifacts/ci/runs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-observations
          path: artifacts/ci
          retention-days: 7
      - name: Clean up lab
        if: always()
        run: docker compose down
