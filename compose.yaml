services:
  lab:
    build: .
    privileged: true
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cn-sim-data:/data
    tmpfs:
      - /run/frr
      - /var/log/frr
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  cn-sim-data:
