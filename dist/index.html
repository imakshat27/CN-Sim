<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A custom network routing workbench. Build topologies, run real RIP, OSPF and EIGRP experiments, trace packets and compare measured performance."
    />
    <title>PacketSim — Routing workbench</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2322c55e'/%3E%3Cpath d='M18 20l28 24M18 44l28-24' stroke='white' stroke-width='3'/%3E%3Cg fill='white'%3E%3Ccircle cx='18' cy='20' r='6'/%3E%3Ccircle cx='46' cy='20' r='6'/%3E%3Ccircle cx='18' cy='44' r='6'/%3E%3Ccircle cx='46' cy='44' r='6'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css?v=20261026-3" />
    <script type="module" src="/app.js?v=20261026-3"></script>
  </head>
  <body>
    <aside class="rail" aria-label="Main navigation">
      <a class="brand-icon" href="#workspace" aria-label="PacketSim home"
        ><svg viewBox="0 0 32 32">
          <path d="M8 9l16 14M8 23L24 9" />
          <circle cx="8" cy="9" r="3" />
          <circle cx="24" cy="9" r="3" />
          <circle cx="8" cy="23" r="3" />
          <circle cx="24" cy="23" r="3" /></svg
      ></a>
      <div id="rail-nav"></div>
      <div class="rail-bottom">
        <span class="avatar" title="Your local network lab">PS</span>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <a class="wordmark" href="#workspace"
          >Packet<span>Sim</span> <span class="version">WORKBENCH / 01</span></a
        >
        <nav id="tabs" aria-label="Workspace views"></nav>
        <div class="backend-state" id="backend-state">
          <span class="status-dot"></span> Connecting
        </div>
      </header>
      <main id="main"></main>
      <footer class="app-footer">
        <span
          ><span class="status-dot small"></span> Local routing laboratory</span
        ><span
          >RIP · OSPF · EIGRP <span class="footer-divider">/</span> Built for
          closer inspection.</span
        >
      </footer>
    </div>
    <aside id="router-popover" class="router-popover" role="dialog" aria-label="Recorded router routing table" hidden></aside>
    <div id="simulation-progress" class="simulation-progress" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <input
      type="file"
      id="import-file"
      accept="application/json,.json"
      hidden
    />
  </body>
</html>
